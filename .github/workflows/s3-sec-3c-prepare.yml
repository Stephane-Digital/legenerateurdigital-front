name: S3.SEC.3.C - Prepare isolated Next preview
on:
  push:
    branches: [test/s3-sec-3c-prepare]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and validate candidate
        run: |
          git checkout -b test/s3-sec-3c-next-preview 673cf2ab2a02acbb25ec01bd375df4554400a123
          npm install next@15.5.29 --save-exact --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          node -e 'const p=require("./package-lock.json").packages; for(const [n,v] of Object.entries({next:"15.5.29",react:"18.3.1","react-dom":"18.3.1"})) if(p["node_modules/"+n].version!==v) process.exit(1)'
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "S3.SEC.3.C - Patch Next.js to 15.5.29"
          git push origin HEAD:refs/heads/test/s3-sec-3c-next-preview
